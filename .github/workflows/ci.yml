name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validation stricte du contenu : front matter, sections, liens internes.
      - run: npm run content
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
